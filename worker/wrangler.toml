# Cloudflare Worker の設定ファイル
# ここを書き換える必要は基本的にありません。

name = "salon-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Workers AI を使うための接続。これがあるので APIキーは不要です。
[ai]
binding = "AI"

[vars]
# ダッシュボードを置いているページのアドレス。ここ以外からは使えません。
ALLOW_ORIGIN = "https://noma-atsuto.github.io"

# 使うAIモデル。変えたいときはここだけ書き換えてください。
# （実際に同じ質問を投げて比べた結果）
#   @cf/openai/gpt-oss-120b     … 標準。いちばん正確で速い。1日およそ108回
#   @cf/openai/gpt-oss-20b      … 少し落ちるが安い。1日およそ227回
#   @cf/qwen/qwen3-30b-a3b-fp8  … さらに安いが、数字を取り違えることがあった
# ※ gemma-4 と glm-4.7-flash は答えが空で返ってきたため使えません。
# ※ llama-3.1-8b は実在しない数字を作ったため使ってはいけません。
MODEL = "@cf/openai/gpt-oss-120b"

# CHAT_TOKEN（合言葉）は secret として別に登録します。ここには書きません。
