name: データ更新

on:
  schedule:
    # 営業時間に合わせた毎正時（cron はUTC。日本時間 −9時間）
    #
    #   平日        11:00〜20:00（押して +30分）→ 11時〜21時に実行
    #   土日・祝日  10:00〜19:00（押して +30分）→ 10時〜20時に実行
    #
    # 祝日はカレンダーで判別できないため平日扱い。10時台の会計は
    # 11時の実行でまとめて取り込まれる（毎回その月ぜんぶを取り直すため）。
    # GitHub 側の混雑で数分〜数十分ずれることがあります。
    - cron: "0 2-12 * * 1-5"   # 平日 11:00〜21:00 JST
    - cron: "0 1-11 * * 0,6"   # 土日 10:00〜20:00 JST
  workflow_dispatch:        # 画面から手動実行もできる

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: このリポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ライブラリを入れる
        run: pip install -r requirements.txt

      - name: 取得済みデータを復元（過去の月は再取得しないため）
        uses: actions/cache@v4
        with:
          path: cache
          key: bm-cache-v2-${{ github.run_id }}
          restore-keys: bm-cache-v2-

      - name: ビューティーメリットからデータを取得
        env:
          BM_LOGIN_ID: ${{ secrets.BM_LOGIN_ID }}
          BM_PASSWORD: ${{ secrets.BM_PASSWORD }}
          TZ: Asia/Tokyo
        run: |
          python fetch_detail.py
          python fetch_rebook.py
          python fetch_shift.py
          python fetch_monthly.py
          # 入口のニュース。取れなくても前回分が残るので、ここで止めない
          python fetch_news.py || true

      - name: ページを作る（合言葉つき）
        env:
          TZ: Asia/Tokyo
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          # AIチャット。この2つが両方そろっているときだけ「AIに聞く」が出ます。
          CHAT_URL: ${{ secrets.CHAT_URL }}
          CHAT_TOKEN: ${{ secrets.CHAT_TOKEN }}
        run: python build_public.py

      - name: 公開リポジトリへ反映（変化がなければ何もしません）
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: noma-atsuto/ikebukuro-kpi
          publish_branch: main
          publish_dir: ./public
          enable_jekyll: false
          commit_message: "データ更新"
          full_commit_message: "データ更新"
